name: lab3-delivery
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: delivery
      MYSQL_USER: delivery
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 ./dev-up}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 ./dev-up}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u delivery delivery -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 ./dev-up}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql-data:
