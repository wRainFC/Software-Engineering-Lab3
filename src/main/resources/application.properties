spring.application.name=delivery
spring.datasource.url=jdbc:mysql://db:3306/delivery?connectionTimeZone=Asia/Shanghai
spring.datasource.username=delivery
spring.datasource.password=${MYSQL_PASSWORD}
management.endpoints.web.exposure.include=health
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=2h
delivery.demo=${DELIVERY_DEMO:false}
delivery.bootstrap-password=${DELIVERY_INITIAL_PASSWORD:}
delivery.refund-fail-first=${DELIVERY_REFUND_FAIL_FIRST:false}
